services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
  qdrant:
    image: qdrant/qdrant:v1.9.5
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
  api:
    image: learnai-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    depends_on:
      - redis
      - qdrant
      - mongo
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
  worker:
    image: learnai-api
    restart: unless-stopped
    env_file:
      - backend/.env
    depends_on:
      - redis
      - qdrant
      - mongo
      - api
    command: ["python", "-m", "backend.worker"]
  web:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://${DOMAIN}/api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    environment:
      - SITE_ADDRESS=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  mongo_data:
  qdrant_data:
  redis_data:
  caddy_data:
  caddy_config:
